services:
  - type: web
    name: qiga-router-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: https://qiga-router.vercel.app,http://localhost:5173,http://localhost:3000
    healthCheckPath: /health
